accepted = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "ISC",
    "OpenSSL",
    "Zlib",
    "bzip2-1.0.6",
    "Unicode-3.0",
]

ignore-dev-dependencies = true
ignore-build-dependencies = true

# The targets the release workflow builds. Without this list cargo-about walks
# every target a dependency names, and lists crates no shipped artifact links:
# tokio, which wasm-bindgen-futures wants for emscripten only, among them.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]
