name: Release
# One release of the player, dispatched by hand from main. A maintainer names the
# version; everything after that is this workflow's, and the same ref with the
# same inputs always produces the same result:
#
#   versions     `<package>@<version>` (today `ssplayer-wgpu@X.Y.Z`).
#                scripts/set-versions.mjs writes it in every job, so each one
#                builds the same tree, and turns the package's `## [Unreleased]`
#                notes into that version's CHANGELOG.md section. The package job
#                commits it to main only once every platform has built and
#                build-release.sh has checked the result. Empty sets nothing and
#                releases the current version wherever it is not out yet: the
#                retry after a run that died halfway.
#
#   publish_npm  The npm package's tarball -- the very file build-release.sh
#                packed, checked and attached to the Release -- is staged on npm
#                through trusted publishing, unless npm already has that
#                version, staged or published. Nothing is public until a
#                maintainer approves it with 2FA, on npmjs.com or with
#                `npm stage approve`, under the dist-tag
#                scripts/npm-dist-tag.sh picks. Off, the Release still
#                carries the tarball. That is how the package's first version
#                ships: npm sets up a trusted publisher only for a package it
#                already has, so a maintainer publishes that version by hand
#                from the tarball (RELEASING.md).
#
#   dry_run      Build and check everything with the version applied, and
#                commit, tag, release and stage nothing. The look before a
#                release. The macOS dylib is signed and notarized as a release
#                signs it when the signing secrets are there, so a broken one
#                shows here first; without them it is left ad-hoc signed, with
#                a warning, where a release stops.
#
# A release gets a `ssplayer-wgpu-v<version>` tag and a DRAFT GitHub Release
# carrying the zips, the npm tarball, the preview shell, SHA256SUMS and a link to
# the package's CHANGELOG.md, which is where the notes are. A maintainer checks
# and publishes it, and publishing is what starts pages.yml.
#
# Staging needs no secret. The package on npm has a trusted publisher for this
# repository and this workflow file, allowed to stage, and the package job's
# id-token is what npm trusts.
#
# Signing does. The macOS zip carries the shared library, which a downloaded
# copy loads only once it is signed with a Developer ID and notarized, and the
# macOS job does both from the organisation's secrets, as the sibling
# repositories do: APPLE_DEV_ID_APP_CERT (the .p12, base64),
# APPLE_DEV_ID_APP_CERT_PASS, APPLE_DEV_ID_APP_NAME (the identity),
# ASC_API_KEY_PASS (the App Store Connect key, base64), ASC_API_KEY_ID and
# ASC_API_ISSUER_ID.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Version to set, as <package>@<version> (ssplayer-wgpu@X.Y.Z). Empty releases the current version.'
        type: string
        default: ''
      publish_npm:
        description: 'Stage the npm package on npm, for a maintainer to approve (its Release is drafted either way)'
        type: boolean
        default: true
      dry_run:
        description: 'Build and check everything, but commit, tag, release and stage nothing'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

# Never let two releases run at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # A Release carries a link to the package's CHANGELOG.md and no notes of its
  # own, so a version without a section there would go out with nothing to say.
  # set-versions.mjs writes the section for the version it sets; a run with
  # `versions` empty releases what main already carries, and this is where a
  # version nobody wrote notes for stops -- first, before any platform builds.
  changelog:
    name: 📝 Changelog
    # Refuse to release from anywhere but main, even if dispatched on another ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set the versions
        if: inputs.versions != ''
        env:
          VERSIONS: ${{ inputs.versions }}
        # shellcheck disable=SC2086
        run: node scripts/set-versions.mjs $VERSIONS

      - name: Check the changelog
        run: |
          set -euo pipefail
          version="$(scripts/release-version.sh)"
          if ! awk -v h="## [${version}] - " 'index($0, h) == 1 { found = 1 } END { exit !found }' libs/ssplayer-wgpu/CHANGELOG.md; then
            echo "::error::libs/ssplayer-wgpu/CHANGELOG.md has no '## [${version}]' section."
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    needs: changelog
    runs-on: ${{ matrix.os }}
    # The macOS leg builds, then waits up to 60 minutes on the notary service
    # (release-macos.sh).
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 🪟 Windows (x86_64)
            artifact: windows-x86_64
            os: windows-latest
          - name: 🍎 macOS (universal)
            artifact: macos-universal
            os: macos-latest
          - name: 🌐 Web (wasm32)
            artifact: web-wasm32
            os: ubuntu-latest

    steps:
      # A release ships the macOS dylib signed and notarized or not at all: a
      # browser quarantines what it downloads, and Gatekeeper refuses a
      # quarantined library that has no ticket (scripts/release-macos.sh says
      # what a user sees). The secrets are the organisation's, and a fork, or a
      # repository they are not shared with, has none. A dry run then builds the
      # library unsigned and says so; a release stops here, before anything is
      # built, rather than drafting a Release whose macOS zip nobody can load.
      # Each variable says whether its secret is set, never what it is.
      - name: Check the signing secrets
        id: signing
        if: matrix.artifact == 'macos-universal'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          APPLE_DEV_ID_APP_CERT: ${{ secrets.APPLE_DEV_ID_APP_CERT != '' }}
          APPLE_DEV_ID_APP_CERT_PASS: ${{ secrets.APPLE_DEV_ID_APP_CERT_PASS != '' }}
          APPLE_DEV_ID_APP_NAME: ${{ secrets.APPLE_DEV_ID_APP_NAME != '' }}
          ASC_API_KEY_PASS: ${{ secrets.ASC_API_KEY_PASS != '' }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID != '' }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID != '' }}
        run: |
          missing=""
          for name in APPLE_DEV_ID_APP_CERT APPLE_DEV_ID_APP_CERT_PASS APPLE_DEV_ID_APP_NAME ASC_API_KEY_PASS ASC_API_KEY_ID ASC_API_ISSUER_ID; do
            [ "${!name}" = "true" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "sign=yes" >> "$GITHUB_OUTPUT"
          elif [ "$DRY_RUN" = "true" ]; then
            echo "::warning::Not set:$missing. This dry run's macOS dylib is ad-hoc signed, and a release would stop here."
            echo "sign=no" >> "$GITHUB_OUTPUT"
          else
            echo "::error::A release signs and notarizes the macOS dylib, and these secrets are not set:$missing"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # build.sh names the SDK release the library links by the submodule's tag
      # -- the VERSION file and ss_sdk_version() -- and the checkout fetched the
      # submodule's commit without its tags.
      - name: Fetch the SDK's tags
        shell: bash
        run: git -C SpriteStudio-SDK fetch --quiet --depth=1 origin 'refs/tags/v*:refs/tags/v*'

      - name: Set the versions
        if: inputs.versions != ''
        shell: bash
        env:
          VERSIONS: ${{ inputs.versions }}
        # One argument per pair, so the split is the point.
        # shellcheck disable=SC2086
        run: node scripts/set-versions.mjs $VERSIONS

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          # Pinned by SHA, so the channel must be named explicitly here.
          toolchain: stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Both Apple targets, so build.sh arch=universal has something to lipo.
      # macos-latest is arm64; the x86_64 slice is a cross-build from the same
      # toolchain, which is the one cross-build Apple makes routine.
      - name: Install the macOS targets
        if: matrix.artifact == 'macos-universal'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Install the wasm target
        if: matrix.artifact == 'web-wasm32'
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        if: matrix.artifact == 'web-wasm32'
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: wasm-pack

      # The npm package's `.` / `./element` entry points are TypeScript, built by
      # tsdown, so the web job needs node as well as cargo. The pnpm version comes
      # from the package's `packageManager` field, not from here.
      - name: Setup pnpm
        if: matrix.artifact == 'web-wasm32'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        if: matrix.artifact == 'web-wasm32'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/ssplayer-wgpu/pnpm-lock.yaml

      # scripts/build.sh IS the platform build: the same command a maintainer
      # runs locally, so a release cannot differ from what was tested by hand.
      # It builds ssplayer-wgpu-ffi, regenerates the C header through cbindgen,
      # and collects the library, the header and the licence into bin/.
      - name: Build (Linux / macOS)
        if: matrix.os != 'windows-latest' && matrix.artifact != 'web-wasm32'
        run: ./scripts/build.sh build=release ${{ matrix.artifact == 'macos-universal' && 'arch=universal' || '' }}

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: ./scripts/build.ps1 build=release
        shell: pwsh

      # deploy=no keeps the package out of examples/web: the release ships the
      # package itself, and the demo is built by pages.yml from its own run.
      - name: Build (Web)
        if: matrix.artifact == 'web-wasm32'
        run: ./scripts/build.sh platform=web build=release deploy=no

      # Only after the build, and removed before the upload: no crate's build
      # script runs while the certificate is in a keychain or the notary key is
      # on disk. The keychain's password is made for this run and never kept,
      # as in SpriteStudio-SDK.
      - name: Set up the signing keychain
        if: steps.signing.outputs.sign == 'yes'
        env:
          APPLE_DEV_ID_APP_CERT: ${{ secrets.APPLE_DEV_ID_APP_CERT }}
          APPLE_DEV_ID_APP_CERT_PASS: ${{ secrets.APPLE_DEV_ID_APP_CERT_PASS }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          printf '%s' "$APPLE_DEV_ID_APP_CERT" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_DEV_ID_APP_CERT_PASS" -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Prepare the notary key
        if: steps.signing.outputs.sign == 'yes'
        env:
          ASC_API_KEY_PASS: ${{ secrets.ASC_API_KEY_PASS }}
        run: |
          printf '%s' "$ASC_API_KEY_PASS" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      # scripts/release-macos.sh is the macOS half of the release, in bin/ before
      # the upload: the dylib's install name moves to @rpath, and then it is
      # signed, notarized and checked against Apple's servers the way Gatekeeper
      # will check it. sign=yes makes a credential that is missing, or a check
      # that fails, fatal; a dry run passes auto, and its identity is empty when
      # the step above found the secrets incomplete, which leaves the dylib
      # ad-hoc signed.
      - name: Sign and notarize (macOS)
        if: matrix.artifact == 'macos-universal'
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.sign == 'yes' && secrets.APPLE_DEV_ID_APP_NAME || '' }}
          APPLE_API_KEY: ${{ steps.signing.outputs.sign == 'yes' && secrets.ASC_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ steps.signing.outputs.sign == 'yes' && secrets.ASC_API_ISSUER_ID || '' }}
        run: ./scripts/release-macos.sh sign=${{ inputs.dry_run && 'auto' || 'yes' }}

      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.sign == 'yes'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary-key.p8"

      # bin/ for the native platforms; for the web one, the npm package directory
      # minus node_modules -- listed file by file rather than as a directory,
      # because upload-artifact has no exclude and the least common ancestor of
      # these paths is packages/ssplayer-wgpu, so the artifact root comes out the
      # same either way. The artifact name is what build-release.sh looks for, and
      # `gh run download -D artifacts` recreates exactly this layout for a local run.
      - name: Upload ${{ matrix.artifact }}
        if: matrix.artifact != 'web-wasm32'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: bin
          if-no-files-found: error
          retention-days: 7

      - name: Upload ${{ matrix.artifact }}
        if: matrix.artifact == 'web-wasm32'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            packages/ssplayer-wgpu/dist
            packages/ssplayer-wgpu/wasm
            packages/ssplayer-wgpu/docs
            packages/ssplayer-wgpu/package.json
            packages/ssplayer-wgpu/README.md
            packages/ssplayer-wgpu/README.ja.md
            packages/ssplayer-wgpu/LICENSE.md
            packages/ssplayer-wgpu/LICENSE.ja.md
            packages/ssplayer-wgpu/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 7

      # The self-contained preview shell (PREVIEW.md), which each Player plugin's
      # packaging script fetches from the Release by its tag. Here because this
      # job has the wasm toolchain and has just built the same crate with the
      # same features: the no-modules target differs only in what wasm-bindgen
      # writes, so cargo reuses that release build. An artifact of its own, named
      # for build-release.sh, because the package's root is packages/ssplayer-wgpu.
      - name: Build the preview shell
        if: matrix.artifact == 'web-wasm32'
        run: ./scripts/build-preview.sh build=release out=bin/ssplayer-preview.html

      - name: Upload preview-shell
        if: matrix.artifact == 'web-wasm32'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-shell
          path: bin/ssplayer-preview.html
          if-no-files-found: error
          retention-days: 7

  package:
    name: 📦 Package
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the version commit, the tag and the draft Release
      id-token: write # trusted publishing on npm

    steps:
      # No submodule here: this job assembles what the matrix already built, so
      # it never touches the SDK and needs no token for it. Full history and
      # tags, so that a tag a run left behind is reused. The only checkout that
      # keeps its credentials: this job pushes the version commit and the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # npm packs the package in build-release.sh and stages it at the end.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Set the versions
        if: inputs.versions != ''
        env:
          VERSIONS: ${{ inputs.versions }}
        # shellcheck disable=SC2086
        run: node scripts/set-versions.mjs $VERSIONS

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      # scripts/build-release.sh IS the release package: one zip per native
      # platform holding include/, lib/ and the licence, the npm package as the
      # tarball npm is given, the preview shell as the web job built it, and
      # SHA256SUMS over all of them. Every option is spelled out so a release
      # cannot change because a default did, and so this is the command a human
      # runs locally — after
      # `gh run download <this run> -D artifacts` — to reproduce these exact
      # archives without rebuilding four platforms.
      #
      # Its checks are the ones nothing else does: that every platform is present
      # rather than three of four, that the cbindgen header is byte-identical
      # across them (it is not, if one job built an older commit), that the
      # macOS dylib is the one release-macos.sh finished -- carrying a Developer
      # ID signature, on a release -- that each finished zip actually holds the
      # library it is named for, and that the tarball holds what the package
      # advertises.
      - name: Build the release
        run: ./scripts/build-release.sh in=artifacts out=release-dist verify=yes clean=yes sign=${{ inputs.dry_run && 'auto' || 'yes' }}

      - name: Upload final release package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssplayer-wgpu-release-dist
          path: release-dist
          if-no-files-found: error
          # A week, not the 90-day default. What is meant to last is attached to
          # the GitHub Release, which never expires; this is a copy for a run
          # that uploaded nothing.
          retention-days: 7

      # Pushed only now, after every platform built and the release checked out.
      # A main that moved during the run rejects the push, and nothing is tagged.
      - name: Commit the versions
        if: inputs.versions != '' && !inputs.dry_run
        env:
          VERSIONS: ${{ inputs.versions }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock packages/ssplayer-wgpu/package.json libs/ssplayer-wgpu/CHANGELOG.md examples/cdn
          git commit -m "chore(release): $VERSIONS"
          git push origin HEAD:main

      - name: Tag and draft the Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(scripts/release-version.sh)"
          tag="ssplayer-wgpu-v${version}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::${tag} already has a Release — skipping."
            exit 0
          fi
          # A run that tagged and then died left the tag behind; it is reused.
          if ! git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "$tag" HEAD
            git push origin "refs/tags/${tag}"
          fi
          notes="See [CHANGELOG.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${tag}/libs/ssplayer-wgpu/CHANGELOG.md) for what changed."
          args=(--verify-tag --title "SpriteStudio Player for wgpu v${version}" --notes "$notes" --draft)
          case "$version" in *-*) args+=(--prerelease) ;; esac
          gh release create "$tag" release-dist/*.zip release-dist/*.tgz release-dist/ssplayer-preview.html release-dist/SHA256SUMS "${args[@]}"
          echo "::notice::Drafted ${tag} — check it and publish it from the Releases page."

      # npm 11.21 is the first CLI that sets a dist-tag through trusted
      # publishing, and Node 22 ships npm 10.
      - name: Update npm
        if: inputs.publish_npm && !inputs.dry_run
        run: npm install -g npm@11.21.0

      # Last, so that a failure here leaves the tag and the draft in place, for a
      # re-run with `versions` empty or a maintainer to finish. npm lists a
      # staged version only once it is approved, so staging one again is refused
      # with a 409, which is skipped like a version npm already has.
      - name: Stage on npm
        if: inputs.publish_npm && !inputs.dry_run
        run: |
          set -euo pipefail
          version="$(scripts/release-version.sh)"
          name="$(node -p "require('./packages/ssplayer-wgpu/package.json').name")"
          if [ -n "$(npm view "${name}@${version}" version 2>/dev/null || true)" ]; then
            echo "::notice::${name}@${version} is already on npm — skipping."
            exit 0
          fi
          dist_tag="$(scripts/npm-dist-tag.sh "$name" "$version")"
          if ! out="$(npm stage publish release-dist/*.tgz --tag "$dist_tag" --access public 2>&1)"; then
            echo "$out"
            if grep -qE "409 Conflict.*previously (published|staged) version \"${version}\"" <<< "$out"; then
              echo "::notice::${name}@${version} is already staged — skipping."
              exit 0
            fi
            exit 1
          fi
          echo "$out"
          echo "::notice::Staged ${name}@${version} under '${dist_tag}' — approve it on npmjs.com or with npm stage approve."
