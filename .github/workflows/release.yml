name: Release
# One release of the player, dispatched by hand from main. A maintainer names the
# version; everything after that is this workflow's, and the same ref with the
# same inputs always produces the same result:
#
#   versions   `<package>@<version>` (today `ssplayer-wgpu@X.Y.Z`).
#              scripts/set-versions.mjs writes it in every job, so each one
#              builds the same tree, and turns the package's `## [Unreleased]`
#              notes into that version's CHANGELOG.md section. The package job
#              commits it to main only once every platform has built and
#              build-release.sh has checked the result. Empty sets nothing and
#              releases the current version if it has no Release yet: the retry
#              after a run that died halfway.
#
#   dry_run    Build and check everything with the version applied, and commit,
#              tag and release nothing. The look before a release.
#
# A release gets a `ssplayer-wgpu-v<version>` tag and a DRAFT GitHub Release
# carrying the zips, SHA256SUMS and a link to the package's CHANGELOG.md, which
# is where the notes are. A maintainer checks and publishes it, and publishing is
# what starts pages.yml.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Version to set, as <package>@<version> (ssplayer-wgpu@X.Y.Z). Empty releases the current version.'
        type: string
        default: ''
      dry_run:
        description: 'Build and check everything, but commit, tag and release nothing'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

# Never let two releases run at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # A Release carries a link to the package's CHANGELOG.md and no notes of its
  # own, so a version without a section there would go out with nothing to say.
  # set-versions.mjs writes the section for the version it sets; a run with
  # `versions` empty releases what main already carries, and this is where a
  # version nobody wrote notes for stops -- first, before any platform builds.
  changelog:
    name: 📝 Changelog
    # Refuse to release from anywhere but main, even if dispatched on another ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set the versions
        if: inputs.versions != ''
        env:
          VERSIONS: ${{ inputs.versions }}
        # shellcheck disable=SC2086
        run: node scripts/set-versions.mjs $VERSIONS

      - name: Check the changelog
        run: |
          set -euo pipefail
          version="$(scripts/release-version.sh)"
          if ! awk -v h="## [${version}] - " 'index($0, h) == 1 { found = 1 } END { exit !found }' libs/ssplayer-wgpu/CHANGELOG.md; then
            echo "::error::libs/ssplayer-wgpu/CHANGELOG.md has no '## [${version}]' section."
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    needs: changelog
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 🪟 Windows (x86_64)
            artifact: windows-x86_64
            os: windows-latest
          - name: 🍎 macOS (universal)
            artifact: macos-universal
            os: macos-latest
          - name: 🌐 Web (wasm32)
            artifact: web-wasm32
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SpriteStudio-SDK is a private submodule in a different repository, so
          # the job-scoped GITHUB_TOKEN cannot fetch it. Supply a fine-grained PAT
          # (or GitHub App token) with read access to it as SDK_SUBMODULE_TOKEN.
          # Once the SDK is public, drop this line and the secret.
          token: ${{ secrets.SDK_SUBMODULE_TOKEN || github.token }}
          submodules: recursive

      # build.sh names the SDK release the library links by the submodule's tag
      # -- the VERSION file and ss_sdk_version() -- and the checkout fetched the
      # submodule's commit without its tags.
      - name: Fetch the SDK's tags
        shell: bash
        run: git -C SpriteStudio-SDK fetch --quiet --depth=1 origin 'refs/tags/v*:refs/tags/v*'

      - name: Set the versions
        if: inputs.versions != ''
        shell: bash
        env:
          VERSIONS: ${{ inputs.versions }}
        # One argument per pair, so the split is the point.
        # shellcheck disable=SC2086
        run: node scripts/set-versions.mjs $VERSIONS

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          # Pinned by SHA, so the channel must be named explicitly here.
          toolchain: stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Both Apple targets, so build.sh arch=universal has something to lipo.
      # macos-latest is arm64; the x86_64 slice is a cross-build from the same
      # toolchain, which is the one cross-build Apple makes routine.
      - name: Install the macOS targets
        if: matrix.artifact == 'macos-universal'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Install the wasm target
        if: matrix.artifact == 'web-wasm32'
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        if: matrix.artifact == 'web-wasm32'
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: wasm-pack

      # The npm package's `.` / `./element` entry points are TypeScript, built by
      # tsdown, so the web job needs node as well as cargo. The pnpm version comes
      # from the package's `packageManager` field, not from here.
      - name: Setup pnpm
        if: matrix.artifact == 'web-wasm32'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        if: matrix.artifact == 'web-wasm32'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/ssplayer-wgpu/pnpm-lock.yaml

      # scripts/build.sh IS the platform build: the same command a maintainer
      # runs locally, so a release cannot differ from what was tested by hand.
      # It builds ssplayer-wgpu-ffi, regenerates the C header through cbindgen,
      # and collects the library, the header and the licence into bin/.
      - name: Build (Linux / macOS)
        if: matrix.os != 'windows-latest' && matrix.artifact != 'web-wasm32'
        run: ./scripts/build.sh build=release ${{ matrix.artifact == 'macos-universal' && 'arch=universal' || '' }}

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: ./scripts/build.ps1 build=release
        shell: pwsh

      # deploy=no keeps the package out of examples/web: the release ships the
      # package itself, and the demo is built by pages.yml from its own run.
      - name: Build (Web)
        if: matrix.artifact == 'web-wasm32'
        run: ./scripts/build.sh platform=web build=release deploy=no

      # bin/ for the native platforms; for the web one, the npm package directory
      # minus node_modules -- listed file by file rather than as a directory,
      # because upload-artifact has no exclude and the least common ancestor of
      # these paths is packages/ssplayer-wgpu, so the artifact root comes out the
      # same either way. The artifact name is what build-release.sh looks for, and
      # `gh run download -D artifacts` recreates exactly this layout for a local run.
      - name: Upload ${{ matrix.artifact }}
        if: matrix.artifact != 'web-wasm32'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: bin
          if-no-files-found: error
          retention-days: 7

      - name: Upload ${{ matrix.artifact }}
        if: matrix.artifact == 'web-wasm32'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            packages/ssplayer-wgpu/dist
            packages/ssplayer-wgpu/wasm
            packages/ssplayer-wgpu/package.json
            packages/ssplayer-wgpu/README.md
            packages/ssplayer-wgpu/README.ja.md
            packages/ssplayer-wgpu/LICENSE.md
            packages/ssplayer-wgpu/LICENSE.ja.md
            packages/ssplayer-wgpu/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 7

  package:
    name: 📦 Package
    needs: build
    runs-on: ubuntu-latest
    # The version commit, the tag and the draft Release.
    permissions:
      contents: write

    steps:
      # No submodule here: this job assembles what the matrix already built, so
      # it never touches the SDK and needs no token for it. Full history and
      # tags, so that a tag a run left behind is reused.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set the versions
        if: inputs.versions != ''
        env:
          VERSIONS: ${{ inputs.versions }}
        # shellcheck disable=SC2086
        run: node scripts/set-versions.mjs $VERSIONS

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      # scripts/build-release.sh IS the release package: one zip per platform
      # holding include/, lib/ and the licence, the npm package as its own, and
      # SHA256SUMS over all of them. Every option is spelled out so a release
      # cannot change because a default did, and so this is the command a human
      # runs locally — after `gh run download <this run> -D artifacts` — to
      # reproduce these exact archives without rebuilding four platforms.
      #
      # Its checks are the ones nothing else does: that every platform is present
      # rather than three of four, that the cbindgen header is byte-identical
      # across them (it is not, if one job built an older commit), and that each
      # finished zip actually holds the library it is named for.
      - name: Build the release
        run: ./scripts/build-release.sh in=artifacts out=release-dist verify=yes clean=yes

      - name: Upload final release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ssplayer-wgpu-release-dist
          path: release-dist
          if-no-files-found: error
          # A week, not the 90-day default. What is meant to last is attached to
          # the GitHub Release, which never expires; this is a copy for a run
          # that uploaded nothing.
          retention-days: 7

      # Pushed only now, after every platform built and the release checked out.
      # A main that moved during the run rejects the push, and nothing is tagged.
      - name: Commit the versions
        if: inputs.versions != '' && !inputs.dry_run
        env:
          VERSIONS: ${{ inputs.versions }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock packages/ssplayer-wgpu/package.json libs/ssplayer-wgpu/CHANGELOG.md examples/cdn
          git commit -m "chore(release): $VERSIONS"
          git push origin HEAD:main

      - name: Tag and draft the Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(scripts/release-version.sh)"
          tag="ssplayer-wgpu-v${version}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::${tag} already has a Release — nothing to do."
            exit 0
          fi
          # A run that tagged and then died left the tag behind; it is reused.
          if ! git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "$tag" HEAD
            git push origin "refs/tags/${tag}"
          fi
          notes="See [CHANGELOG.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${tag}/libs/ssplayer-wgpu/CHANGELOG.md) for what changed."
          args=(--verify-tag --title "SpriteStudio Player for wgpu v${version}" --notes "$notes" --draft)
          case "$version" in *-*) args+=(--prerelease) ;; esac
          gh release create "$tag" release-dist/*.zip release-dist/SHA256SUMS "${args[@]}"
          echo "::notice::Drafted ${tag} — check it and publish it from the Releases page."
