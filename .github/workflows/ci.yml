name: CI

# Two tiers, as in SpriteStudio-SDK. Every pull request lints and tests the
# crates on Linux, compares its rendering with its base's there, builds the C
# face with the Vulkan viewer there and the DX12 viewer on Windows, and builds
# the wasm face with the npm package and the preview shell. The weekly run and
# a dispatch also build for macOS the way release.yml does (universal), with the
# Metal viewer, and build the documentation site. There is no release PR here: a
# release is dispatched from main.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE*'
  # Writes the main caches that PRs restore from, since PRs do not save (see
  # save-if on each Rust cache step). Weekly is enough: when Cargo.lock differs,
  # rust-cache still restores the newest cache built by the same toolchain, so a
  # PR that changes dependencies rebuilds only what changed.
  schedule:
    # Each repository of the family takes its own hour on Sunday, so their
    # weekly runs do not queue for the organization's runners; :17 keeps clear
    # of the top of the hour, when GitHub delays scheduled runs.
    - cron: '17 4 * * 0'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 🐧 Lint & Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          # Pinned by SHA, so the channel must be named explicitly here.
          toolchain: stable
          components: clippy, rustfmt

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes caches. A PR's cache is visible to that PR alone, so
          # saving one per PR would only fill the 10 GB quota and evict the main
          # caches every PR restores from.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # deploy-examples.sh builds ssconverter-cli inside the SDK checkout,
          # into the SDK's own target dir, which the default "." would miss.
          workspaces: |
            . -> target
            SpriteStudio-SDK -> target

      - name: Format check
        run: cargo fmt --all -- --check

      # The PowerShell half of each script runs on no pull request -- release.yml
      # takes build.ps1 only when a release is cut -- so a syntax error, or an
      # option the .sh learned and the .ps1 did not, reached main unseen. Parse
      # every .ps1, and hold each one and its .sh twin to the same answers:
      # --help exits 0 and an unknown option exits 2.
      - name: Check the PowerShell scripts against their .sh twins
        shell: pwsh
        run: |
          $failed = $false
          function Report([string] $Name, [string] $Message) {
            Write-Host "::error file=scripts/${Name}::$Message"
            $script:failed = $true
          }
          foreach ($ps1 in Get-ChildItem scripts -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($ps1.FullName, [ref]$null, [ref]$errors)
            if ($errors) {
              foreach ($e in $errors) { Report $ps1.Name "line $($e.Extent.StartLineNumber): $($e.Message)" }
              continue
            }
            $sh = [System.IO.Path]::ChangeExtension($ps1.FullName, ".sh")
            foreach ($case in @(@{ Arg = "--help"; Want = 0 }, @{ Arg = "no-such-option=1"; Want = 2 })) {
              pwsh -NoProfile -File $ps1.FullName $case.Arg *> $null
              if ($LASTEXITCODE -ne $case.Want) { Report $ps1.Name "$($case.Arg) exited $LASTEXITCODE, not $($case.Want)" }
              if (Test-Path $sh) {
                bash $sh $case.Arg *> $null
                if ($LASTEXITCODE -ne $case.Want) { Report (Split-Path $sh -Leaf) "$($case.Arg) exited $LASTEXITCODE, not $($case.Want)" }
              }
            }
          }
          # Explicit, because the runner otherwise exits with the last native
          # command's code -- which is the 2 an unknown option is meant to give.
          if ($failed) { exit 1 } else { exit 0 }

      - name: Generate demo assets
        # Also proves the SDK submodule still builds against this checkout. A
        # debug converter converts the samples just as well, and compiles in a
        # fraction of the release build's time (locally 1-7 s against 37 s). The
        # weekly run builds the same profile, since it writes the cache PRs
        # restore; the release converter is SpriteStudio-SDK's to build.
        run: ./scripts/deploy-examples.sh build=debug

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install a software GPU (Mesa lavapipe)
        # The runner has no real adapter, and every offscreen-rendering test skips
        # itself when `request_adapter` fails — so the half of the suite that
        # actually draws (render.rs, scene.rs, pack.rs, events.rs, timing.rs) used
        # to verify nothing here. lavapipe is Mesa's software Vulkan device: wgpu
        # sees a conformant adapter and those tests run for real.
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools

      - name: Show the adapter the tests will use
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        # Deliberately a hard failure: the rendering tests skip themselves when
        # there is no adapter, so without this a broken driver install would come
        # back as a green run that drew nothing.
        run: vulkaninfo --summary

      - name: Test
        env:
          # Point the Vulkan loader at lavapipe alone, so the suite cannot pick up
          # some other adapter the image happens to carry. VK_DRIVER_FILES is the
          # current name, VK_ICD_FILENAMES the one older loaders read.
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        # `golden_corpus` stays out of this: it byte-compares against a dump from
        # the same machine, so it is `#[ignore]`d, and the golden job runs it
        # against the base's rendering instead.
        run: cargo test --workspace

      - name: Build the ffi face
        # No native default command compiles src/ffi.rs or src/host.rs, so build
        # the feature explicitly, then build the ffi crate that regenerates the header.
        run: |
          cargo clippy -p ssplayer-wgpu --features ffi --all-targets -- -D warnings
          cargo build -p ssplayer-wgpu-ffi

      - name: Test the ffi face
        # The `cargo test --workspace` above runs with default features, which do
        # not compile src/ffi.rs at all — so until this step the C face was linted
        # and built but never *run*, and a unit test written next to it would have
        # been dead weight. `--lib` keeps this to the tests that only exist under
        # the feature: every entry point in `ffi.rs` needs a window and a device,
        # so the integration suite has nothing here it can drive.
        run: cargo test -p ssplayer-wgpu --features ffi --lib

      - name: Check the generated header is up to date
        run: git diff --exit-code -- libs/ssplayer-wgpu-ffi/include/ssplayer_wgpu.h

      # The Linux half of the C face's examples, as the windows job builds the
      # DX12 one. Debug, so cargo reuses the ffi build above and only the viewer
      # compiles. A compile check: the runner has no display to open a window on.
      - name: Build the Vulkan C++ viewer
        run: |
          sudo apt-get install -y libx11-dev libwayland-dev wayland-protocols
          cmake -S examples/viewer-vulkan-cpp -B examples/viewer-vulkan-cpp/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build examples/viewer-vulkan-cpp/build

  # The suite's other rendering tests assert on invariants and pixel counts,
  # which a part moved by a pixel or a colour that drifted passes. This renders
  # the golden corpus twice on the same software GPU -- the pull request's base,
  # then its head -- and fails when any image differs, so the reference is never
  # checked in and lavapipe never has to agree with a real GPU. A change that is
  # meant to move pixels fails here too: the triptychs it uploads are what the
  # review looks at.
  golden:
    name: 🖼️ Golden images (Linux)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Checkout the base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: golden-base
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          # Pinned by SHA, so the channel must be named explicitly here.
          toolchain: stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The check job's key, since main writes that one and builds the same
          # workspaces in the same profile; this job runs on pull requests only,
          # so it never saves and cannot evict it.
          shared-key: check
          save-if: false
          workspaces: |
            . -> target
            SpriteStudio-SDK -> target

      - name: Install a software GPU (Mesa lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools

      - name: Show the adapter the images come from
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: vulkaninfo --summary

      - name: Render the base
        working-directory: golden-base
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          SS_GOLDEN_DIR: ${{ runner.temp }}/golden/base
        # Each checkout converts its own fixtures, so an SDK bump is compared
        # too, and builds into its own target dir, so the base compiles its
        # dependencies afresh. Never point the two at one: they lay their crates
        # out at the same relative paths, so cargo would take the head's sources,
        # checked out before the base was built, for fresh and run the base's
        # binary twice -- a comparison that cannot fail.
        run: |
          ./scripts/deploy-examples.sh build=debug
          cargo test -p ssplayer-wgpu --test golden -- --ignored

      - name: Render the head and compare
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          SS_GOLDEN_DIR: ${{ runner.temp }}/golden/head
          SS_GOLDEN_COMPARE: ${{ runner.temp }}/golden/base
        run: |
          ./scripts/deploy-examples.sh build=debug
          cargo test -p ssplayer-wgpu --test golden -- --ignored

      - name: Summarize the comparison
        if: always()
        run: |
          summary="$RUNNER_TEMP/golden/head/summary.md"
          if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the triptychs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-diff
          path: |
            ${{ runner.temp }}/golden/head/summary.md
            ${{ runner.temp }}/golden/head/diff/
          if-no-files-found: ignore

  windows:
    name: 🪟 DX12 viewer (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          # Pinned by SHA, so the channel must be named explicitly here.
          toolchain: stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The Win32 half of the C face compiles on no other runner: `ffi.rs`'s
      # `SS_WINDOW_WIN32` arm and the whole of examples/viewer-dx12-cpp are
      # `cfg`-ed or `#include`-d out everywhere else. The runner has no GPU, so
      # this is a compile check and nothing more — DX12 itself still has to be
      # exercised by running the viewer on real hardware.
      #
      # Debug, on pull requests and in the weekly run alike: a compile check
      # needs no optimizer, the weekly run writes the cache PRs restore so both
      # must build the same profile, and release.yml builds the release library.
      - name: Build the ffi face (MSVC)
        run: cargo build -p ssplayer-wgpu-ffi

      - name: Build the DX12 C++ viewer
        run: |
          cmake -S examples/viewer-dx12-cpp -B examples/viewer-dx12-cpp/build
          cmake --build examples/viewer-dx12-cpp/build --config Debug

  wasm:
    name: 🌐 Web (wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          # Pinned by SHA, so the channel must be named explicitly here.
          toolchain: stable
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Build the js face
        run: cargo build -p ssplayer-wgpu --target wasm32-unknown-unknown --no-default-features --features web

      # The Linux job's clippy builds default features, which leave src/web.rs
      # out, so until this step the js face was compiled but never linted.
      - name: Clippy (js face)
        run: cargo clippy -p ssplayer-wgpu --target wasm32-unknown-unknown --no-default-features --features web -- -D warnings

      # The TypeScript layer of @spritestudio/ssplayer-wgpu types itself against
      # wasm-pack's generated .d.ts, so a change to the js face's Rust signatures
      # breaks it silently -- cargo compiles the wasm happily and no other job
      # touches the package. Typechecking it here is the guard, and it needs the
      # .d.ts, which only wasm-pack emits.
      - name: Install wasm-pack
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: wasm-pack

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/ssplayer-wgpu/pnpm-lock.yaml

      # build=debug on purpose: --dev skips wasm-opt and reuses the debug artifacts
      # the step above already built. Size figures never come from this job.
      - name: Build the npm package
        run: ./scripts/build.sh platform=web build=debug deploy=no

      - name: Typecheck the js layer
        working-directory: packages/ssplayer-wgpu
        run: pnpm run typecheck

      # The preview shell (examples/preview/shell.html) is the js face's other
      # consumer, and nothing else builds it: examples/preview-gen's tests fill
      # a fake one. build-preview.sh refuses a page that loads anything from
      # outside itself or calls a method the glue does not define, so building it
      # is the check. Debug, as the package above: the no-modules target differs
      # only in what wasm-bindgen writes, so cargo reuses that build and this
      # costs a few seconds, and the cache the weekly run writes stays the one
      # PRs restore. release.yml builds the release one.
      - name: Build the preview shell
        run: ./scripts/build-preview.sh build=debug out="$RUNNER_TEMP/ssplayer-preview.html"

  # The weekly tier. main takes every pull request and a release is dispatched
  # from it, so there is no release PR to run this on.
  macos:
    name: 🍎 macOS (universal) and the Metal viewer
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          # Pinned by SHA, so the channel must be named explicitly here.
          toolchain: stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the macOS targets
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      # scripts/build.sh, as release.yml builds the macos-universal artifact.
      - name: Build (universal)
        run: ./scripts/build.sh build=release arch=universal

      - name: Build the Metal C++ viewer
        run: |
          cmake -S examples/viewer-metal-cpp -B examples/viewer-metal-cpp/build
          cmake --build examples/viewer-metal-cpp/build

  # Builds the site the way pages.yml publishes it, both locales --strict, so a
  # broken link or nav entry surfaces here rather than when a release is
  # published.
  docs:
    name: 📚 Docs site
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install the documentation toolchain
        run: pip install -r docs/requirements.txt

      # The site carries the rustdoc and the web demo as well, so it needs the
      # wasm toolchain and the npm package's build.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: wasm-pack

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/ssplayer-wgpu/pnpm-lock.yaml

      - name: Build the site (docs + rustdoc + demo)
        run: ./scripts/build-pages.sh prepare=no
