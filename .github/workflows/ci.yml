name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 🐧 Lint & Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # SpriteStudio-SDK is a private submodule in a different repository, so
          # the job-scoped GITHUB_TOKEN cannot fetch it. Supply a fine-grained PAT
          # (or GitHub App token) with read access to it as SDK_SUBMODULE_TOKEN.
          # Once the SDK is public, drop this line and the secret.
          token: ${{ secrets.SDK_SUBMODULE_TOKEN || github.token }}
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Generate demo assets
        # Also proves the SDK submodule still builds against this checkout.
        run: ./scripts/deploy-examples.sh

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        # Runners have no GPU adapter, so the offscreen rendering tests in
        # libs/ssplayer-wgpu/tests/render.rs skip themselves here. Rendering changes must be
        # verified locally on a real adapter.
        run: cargo test --workspace

      - name: Build the ffi face
        # No native default command compiles src/ffi.rs or src/host.rs, so build
        # the feature explicitly. This also regenerates the cbindgen header.
        run: cargo clippy -p ssplayer-wgpu --features ffi --all-targets -- -D warnings

      - name: Check the generated header is up to date
        run: git diff --exit-code -- libs/ssplayer-wgpu/include/ssplayer_wgpu.h

  windows:
    name: 🪟 DX12 viewer (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.SDK_SUBMODULE_TOKEN || github.token }}
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      # The Win32 half of the C face compiles on no other runner: `ffi.rs`'s
      # `SS_WINDOW_WIN32` arm and the whole of examples/viewer-dx12-cpp are
      # `cfg`-ed or `#include`-d out everywhere else. The runner has no GPU, so
      # this is a compile check and nothing more — DX12 itself still has to be
      # exercised by running the viewer on real hardware (SPEC §14).
      - name: Build the ffi face (MSVC)
        run: cargo build -p ssplayer-wgpu --features ffi --release

      - name: Build the DX12 C++ viewer
        run: |
          cmake -S examples/viewer-dx12-cpp -B examples/viewer-dx12-cpp/build
          cmake --build examples/viewer-dx12-cpp/build --config Release

  wasm:
    name: 🌐 Web (wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.SDK_SUBMODULE_TOKEN || github.token }}
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Build the js face
        run: cargo build -p ssplayer-wgpu --target wasm32-unknown-unknown --no-default-features --features web
