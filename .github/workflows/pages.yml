name: Publish docs via GitHub Pages

on:
  # Published with a release, and on demand. The site describes the library as it
  # stands on the branch this runs from, so a dispatch from `main` between
  # releases is the way to ship a documentation-only fix.
  release:
    types: [published]
  workflow_dispatch:

# Least privilege: the site is published via the Pages deployment API (OIDC),
# not by pushing to a branch, so no `contents: write` is needed. Only deploy
# gets `pages: write` and `id-token: write`; build, which runs the
# repository's scripts, reads the Pages site for configure-pages and no more.
permissions:
  contents: read

# One concurrent deployment at a time; don't cancel an in-flight production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A Release deploys the site only when it becomes Latest
  # (scripts/release-channel.sh, read from the default branch): a pre-release
  # once its package has a full release, or a patch to an earlier line, leaves
  # the site as it is. A dispatch deploys from a tag or main (RELEASING deploys
  # a fix to the docs from main), and refuses any other branch.
  channel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.channel.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-tags: true
          persist-credentials: false
      - id: channel
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != release ]; then
            case "$GITHUB_REF" in
              refs/tags/* | refs/heads/main)
                echo "deploy=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
            echo "::error::a dispatch deploys from a tag or main, and ${GITHUB_REF_NAME} is neither"
            exit 1
          fi
          channel="$(./scripts/release-channel.sh "$TAG")"
          echo "::notice::${TAG} is a ${channel} release"
          if [ "$channel" = latest ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: channel
    if: needs.channel.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The site is not only Markdown: it carries the workspace rustdoc at
          # /api/ and the WebGPU demo at /demo/, and the demo's animation data is
          # converted by ssconverter-cli out of the SDK. So this job needs the
          # submodule, exactly like ci.yml and release.yml.
          submodules: recursive
          persist-credentials: false

      # --- the documentation half -----------------------------------------
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: docs/requirements.txt

      # The pin, installed straight onto PATH. build-docs.sh finds it there when
      # there is no venv, which is exactly this case -- hence prepare=no below.
      - name: Install the documentation toolchain
        run: pip install -r docs/requirements.txt

      # --- the rustdoc and demo halves ------------------------------------
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # Pinned by SHA, so the channel must be named explicitly here.
          toolchain: stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # release.yml's job is named build too, and its web leg runs on the
          # same image: without a key of its own, the two would share a cache.
          key: pages
          # A Release's run is on its tag, and a cache saved there would be
          # visible to that tag alone.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: wasm-pack

      # The npm package's `.` / `./element` entry points are TypeScript, built by
      # tsdown, so the demo needs node as well as cargo. The pnpm version comes
      # from the package's `packageManager` field, not from here.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: packages/ssplayer-wgpu/package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: packages/ssplayer-wgpu/pnpm-lock.yaml

      # scripts/build-pages.sh IS the published tree: the two locales, the
      # rustdoc grafted at site/api, and examples/web at site/demo -- assembled
      # in the one order that works, because the English build clears site/ and
      # everything else lives inside it. The same command a maintainer runs
      # locally, so a publish cannot differ from what was checked by hand.
      #
      # prepare=no: the toolchain is a step of its own above, so a dependency
      # failure is legible as one in the run summary.
      - name: Build the site (docs + rustdoc + demo)
        run: ./scripts/build-pages.sh prepare=no

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
