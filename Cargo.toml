[workspace]
resolver = "3"
members = [
    "libs/ssplayer-wgpu",
    "libs/ssplayer-wgpu-ffi",
    "libs/ssplayer-bevy",
    "examples/hello",
    "examples/preview-gen",
    "examples/viewer",
    "examples/viewer-bevy",
    "examples/overall-bevy",
]
# The SDK submodule is a workspace of its own. Without this, cargo claims every
# package under this directory and tries to resolve the SDK crates' inherited
# dependencies against *this* manifest.
exclude = ["SpriteStudio-SDK"]

# `version` is the player's: `ssplayer-wgpu` and `ssplayer-wgpu-ffi` inherit it,
# packages/ssplayer-wgpu/package.json carries the copy npm needs, the
# `ssplayer-wgpu` entry of [workspace.dependencies] the copy a crate that depends
# on it publishes with, and scripts/release-version.sh refuses to print it while
# either copy disagrees. The release tag is `ssplayer-wgpu-v` followed by it, and
# scripts/set-versions.mjs is what changes it. Every other crate declares its own.
#
# The player carries the SDK family line, which is what `ssab` and `ssruntime`
# resolve to. The prerelease word is the maturity signal and is not cosmetic: beta
# means the surface is frozen and only quality moves. `examples/*` publish nowhere
# and stay at `0.1.0` on purpose.
[workspace.package]
version = "7.0.0-beta.1"
edition = "2024"
rust-version = "1.100"
authors = ["CRI Middleware Co., Ltd."]
license = "BSD-3-Clause"
repository = "https://github.com/cri-middleware/SSPlayerForWgpu"
homepage = "https://cri-middleware.github.io/SSPlayerForWgpu/"
description = "SpriteStudio Player for wgpu: renders SpriteStudio animations (.ssab) with wgpu."

[workspace.dependencies]
# The SDK crates build from the git submodule: this player links the runtime's
# Rust API directly (not the C-API the other Players use), so it has to track
# unreleased .ssab schema changes. `git submodule update --init` first.
# `version` is what a published crate asks crates.io for instead, as cargo drops
# `path` on publish, and cargo refuses to build when the submodule's crates do not
# match it. Publishing builds against crates.io, so a release can use only what
# the SDK there already has.
# No `std`, deliberately: the feature swaps ssruntime's float maths from the
# `libm` crate to the platform's, and every other Player ships the no_std build.
# Leaving it on would make this the one Player whose playback arithmetic can
# differ.
ssruntime = { version = "7.0.0-beta.1", path = "SpriteStudio-SDK/libs/ssruntime" }
ssab = { version = "7.0.0-beta.1", path = "SpriteStudio-SDK/libs/ssab", default-features = false }
ssplayer-wgpu = { version = "7.0.0-beta.1", path = "libs/ssplayer-wgpu" }

# The engine an adapter crate targets, pinned here beside `wgpu` because the two
# constraints are one: `bevy_render` 0.20 requires wgpu ^30, so a Bevy bump
# that moves to a new wgpu major breaks the pin below. Keeping both in this file
# makes that a compile error in CI rather than something to remember. npm would
# call this a peerDependency; cargo has no such thing, so the supported range is
# stated here and in the adapter's README.
bevy = { version = "0.20.1", default-features = false }
# Versions centralized here so core, the viewer, and the wasm build never drift.
# Pinned to the 30 line to stay compatible with Slint's `unstable-wgpu-30`: a
# host that composes a Slint UI and this player on one device needs the exact
# wgpu major Slint names. Do not bump without checking Slint's supported major.
wgpu = "30.0.2"
wasm-bindgen = { version = "0.2.130", default-features = false }
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
web-sys = "0.3.107"
console_error_panic_hook = "0.1.7"

[profile.dev]
panic = "abort"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
strip = "symbols"
