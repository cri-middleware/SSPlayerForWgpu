[workspace]
resolver = "3"
members = [
    "libs/ssplayer-wgpu",
    "libs/ssplayer-wgpu-ffi",
    "libs/ssplayer-bevy",
    "examples/viewer",
    "examples/viewer-bevy",
    "examples/overall-bevy",
]
# The SDK submodule is a workspace of its own. Without this, cargo claims every
# package under this directory and tries to resolve the SDK crates' inherited
# dependencies against *this* manifest.
exclude = ["SpriteStudio-SDK"]

# `version` is deliberately not inherited: the player and the viewer are versioned
# independently, so each crate declares its own.
#
# The three published crates carry the SDK family line, which is what `ssab` and
# `ssruntime` resolve to — `ssplayer-wgpu` and `ssplayer-wgpu-ffi` at `7.0.0-beta.1`,
# `ssplayer-bevy` at `7.0.0-alpha.1`. The prerelease word is the maturity signal and
# is not cosmetic: beta means the surface is frozen and only quality moves, alpha
# means it is still open, which the Bevy adapter is while it tracks one Bevy line at
# a time. `examples/*` publish nowhere and stay at `0.1.0` on purpose.
[workspace.package]
edition = "2024"
rust-version = "1.98"
authors = ["CRI Middleware Co., Ltd."]
license = "BSD-3-Clause"
repository = "https://github.com/cri-middleware/SSPlayerForWgpu"
homepage = "https://www.webtech.co.jp/eng/spritestudio/"
description = "wgpu renderer for SpriteStudio animations"

[workspace.dependencies]
# The SDK is a git submodule rather than a released crate: this player links the
# runtime's Rust API directly (not the C-API the other Players use), so it has to
# track unreleased .ssab schema changes. `git submodule update --init` first.
# No `std`, deliberately: the feature swaps ssruntime's float maths from the
# `libm` crate to the platform's, and every other Player ships the no_std build.
# Leaving it on would make this the one Player whose playback arithmetic can
# differ. It used to be forced — ssruntime's `[lib]` declared staticlib/cdylib,
# cargo builds every crate-type of a dependency, and those artifacts wanted an
# allocator and a panic handler on every target — but the SDK moved them to
# ssruntime-ffi, so what arrives here is a plain rlib and the allocator comes
# from this player's own std-linked binary.
ssruntime = { path = "SpriteStudio-SDK/libs/ssruntime" }
ssab = { path = "SpriteStudio-SDK/libs/ssab", default-features = false }
ssplayer-wgpu = { path = "libs/ssplayer-wgpu" }

# The engine an adapter crate targets, pinned here beside `wgpu` because the two
# constraints are one: `bevy_render` 0.19 requires wgpu ^29.0.3, so a Bevy bump
# that moves to a new wgpu major breaks the pin above. Keeping both in this file
# makes that a compile error in CI rather than something to remember. npm would
# call this a peerDependency; cargo has no such thing, so the supported range is
# stated here and in the adapter's README.
bevy = { version = "0.19", default-features = false }
# Versions centralized here so core, the viewer, and the wasm build never drift.
# Pinned to the 29 line to stay compatible with Slint's `unstable-wgpu-29`: the
# Vtuber app composes Slint UI and this player on one device, and Slint requires
# an exact wgpu major. Do not bump without checking Slint's supported major.
wgpu = "29"
wasm-bindgen = { version = "0.2.126", default-features = false }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.dev]
panic = "abort"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
strip = "symbols"
