<!doctype html>
<!--
  The self-contained `.ssab` preview shell.

  This file is the SOURCE. `scripts/build-preview.sh` substitutes five markers
  and writes the artifact that actually ships: the wasm-bindgen `no-modules`
  glue verbatim, the wasm as base64, the version and date stamps, and the
  license notices. Each marker is spelled `__SS_<NAME>__` and the build refuses
  a source that carries one of them twice -- a second mention, here in this
  comment for instance, would be substituted as well, and a page carrying two
  copies of the wasm still works, so nothing downstream would catch it.

  Everything else — this markup, this CSS, this script — ships as written. There
  is no `src` and no `import` anywhere in the result, because at `file://` an
  external module script is blocked and an inline module script is not. The one
  `fetch` is the URL entrance's, which reads only in a Chrome started with
  `--allow-file-access-from-files`. See PREVIEW.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpriteStudio preview</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #1a1d21;
    --dim: #6b7280;
    --line: #e2e5ea;
    --accent: #3b82f6;
    /* One colour per event kind, used by both the strip and the list so a
       marker and its row are recognisably the same thing. */
    --user-data: #8b5cf6;
    --signal: #0ea5e9;
    --audio: #f59e0b;
    --thumb: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171c; --panel: #1b1f26; --ink: #e8eaed; --dim: #9aa3af; --line: #2b313a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  header, footer { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 8px 16px; }
  header { border-bottom: 1px solid var(--line); }
  footer { border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; margin-top: auto; }
  .grow { flex: 1 1 auto; }
  .stamp { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12px; }
  .badge { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--dim); font-size: 12px; cursor: help; }
  .banner { padding: 6px 16px; border-bottom: 1px solid var(--line); color: #b45309; background: color-mix(in srgb, #f59e0b 12%, transparent); }
  select, button {
    font: inherit; color: inherit; background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px;
  }
  #pack { max-width: 36ch; }
  button { cursor: pointer; min-width: 36px; }
  button:hover { border-color: var(--accent); }
  button.link { border: 0; background: none; padding: 0; min-width: 0; color: inherit; text-decoration: underline; }

  main { flex: 1 1 auto; display: flex; flex-direction: column; gap: 12px; padding: 16px; min-height: 0; min-width: 0; }
  #stage {
    position: relative; flex: 1 1 auto; min-height: 220px;
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    /* A checkerboard, so a transparent background is visibly transparent and a
       black-on-black animation is not mistaken for nothing drawn. */
    background-color: var(--panel);
    background-image:
      linear-gradient(45deg, rgba(128,128,128,.18) 25%, transparent 25%, transparent 75%, rgba(128,128,128,.18) 75%),
      linear-gradient(45deg, rgba(128,128,128,.18) 25%, transparent 25%, transparent 75%, rgba(128,128,128,.18) 75%);
    background-size: 16px 16px; background-position: 0 0, 8px 8px;
  }
  /* Absolutely positioned, so the canvas cannot size the box that sizes the
     canvas: with `width: 100%` in the flex flow, its intrinsic size (the
     backing-store attributes this script writes) feeds back into the stage and
     the pair inflate each other a little more every resize. */
  canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  #drop {
    position: absolute; inset: 0; display: grid; place-content: center; gap: 6px; text-align: center; padding: 16px;
    background: color-mix(in srgb, var(--panel) 88%, transparent); color: var(--dim);
  }
  #drop.over { outline: 2px dashed var(--accent); outline-offset: -8px; color: var(--ink); }
  #drop strong { display: block; color: var(--ink); font-size: 15px; }
  #drop span { max-width: 60ch; }
  #drop.hidden { display: none; }

  .transport { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .transport label { color: var(--dim); display: flex; gap: 6px; align-items: center; }
  #frame { font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }

  /* The seek bar and the marker strip share one coordinate space: both are
     inset by half a thumb at each end, so a marker sits exactly under the thumb
     for the frame it names. */
  .track { position: relative; flex: 1 1 260px; min-width: 200px; }
  #seek { width: 100%; margin: 0; }
  #markers { position: relative; height: 14px; margin-top: 2px; }
  .marker {
    position: absolute; top: 0; width: 8px; height: 10px; margin-left: -4px;
    border-radius: 2px; cursor: pointer; opacity: .85;
    transition: transform .12s ease, opacity .12s ease;
  }
  .marker:hover { transform: scaleY(1.35); opacity: 1; }
  .marker.fired { transform: scaleY(1.6); opacity: 1; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 35%, transparent); }
  .kind-userData { background: var(--user-data); color: var(--user-data); }
  .kind-signal   { background: var(--signal);    color: var(--signal); }
  .kind-audio    { background: var(--audio);     color: var(--audio); }

  #events { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); max-height: 34vh; overflow: auto; }
  /* Fixed layout and a wrapping payload cell, because the alternative is a
     page wider than the window: one long user-data string widens the table,
     which widens the flex column, which stretches the stage the canvas sizes
     itself from -- and the animation ends up rendered into a box that is off
     screen. */
  #events table { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: 12px; }
  #events td { overflow-wrap: anywhere; }
  #events td:nth-child(1), #events th:nth-child(1) { width: 4.5em; }
  #events td:nth-child(2), #events th:nth-child(2) { width: 6em; }
  #events td:nth-child(3), #events th:nth-child(3) { width: 9em; }
  #events th { text-align: left; font-weight: 600; color: var(--dim); padding: 6px 10px; position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line); }
  #events td { padding: 4px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  #events tr { cursor: pointer; }
  #events tr:hover td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  #events tr.fired td { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: baseline; }
  .empty { padding: 10px; color: var(--dim); }
  .warn { color: #b45309; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  dialog { width: min(860px, 92vw); max-height: 86vh; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); }
  dialog pre { margin: 0; padding: 16px; max-height: calc(86vh - 56px); overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; }
  dialog form { display: flex; justify-content: flex-end; padding: 8px 16px; border-top: 1px solid var(--line); }
</style>
</head>
<body>

<header>
  <select id="pack" disabled><option>no pack loaded</option></select>
  <select id="anim" disabled></select>
  <button id="reload" title="Read the files again" hidden>↻</button>
  <span class="grow"></span>
  <span class="badge" title="What the .ssab holds, played by SpriteStudio Player for wgpu. It is not your engine's renderer, and does not aim to match it pixel for pixel.">Reference playback (wgpu)</span>
  <span class="stamp" id="stamp">__SS_VERSION__ · __SS_BUILT__</span>
</header>
<div id="mismatch" class="banner" hidden></div>

<main>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="drop">
      <strong>Drop a <code>.ssab</code> here</strong>
      <span>Drop its <code>.png</code> atlases and any sibling <code>.ssab</code> with it, in one go, or the folder that holds them.</span>
    </div>
  </div>

  <div class="transport">
    <button id="playPause" title="Play / pause" disabled>⏸</button>
    <button id="restart" title="Back to the start" disabled>↺</button>
    <div class="track">
      <input id="seek" type="range" min="0" max="100" value="0" step="0.1" disabled>
      <div id="markers"></div>
    </div>
    <span id="frame">0.0 / 0</span>
    <label>speed <input id="speed" type="range" min="0.1" max="3" step="0.1" value="1" style="width:90px"><span id="speedOut">1.0</span></label>
    <label><input id="sub" type="checkbox" checked> sub-frame</label>
  </div>

  <div id="events"><div class="empty">Events appear here as the animation plays them.</div></div>
</main>

<footer>
  <span id="stats">—</span>
  <span class="stamp" id="converted"></span>
  <span class="grow"></span>
  <span id="note"></span>
  <button class="link" id="licenses">Licenses</button>
</footer>

<dialog id="noticesDialog">
  <pre id="noticesText"></pre>
  <form method="dialog"><button>Close</button></form>
</dialog>

<script id="ssab" type="application/base64"></script>
<script id="files" type="application/json">{}</script>
<script id="notices" type="application/json">__SS_NOTICES__</script>

<script>__SS_GLUE__</script>
<script id="wasm" type="application/base64">__SS_WASM__</script>

<script type="module">
const $ = (id) => document.getElementById(id);
const note = (message, warn) => { $('note').textContent = message; $('note').className = warn ? 'warn' : ''; };

/** base64 → bytes, without `fetch`, which `file://` blocks. */
function bytes(base64) {
  const clean = (base64 || '').trim();
  if (!clean) return null;
  const binary = atob(clean);
  const out = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
  return out;
}

let ctx, surface, player;
let playing = false, dragging = false;
let start = 0, end = 0;

// --- the event table, discovered by watching playback --------------------
//
// The player reports events as a pulse: what the tick just crossed. There is no
// authored-table read-out and deliberately so — it would be an API with one
// caller, this page. So the strip fills itself: one play-through visits every
// frame of the section, and the runtime reports every frame a tick stepped
// across (not merely the one it landed on), so nothing is missed at any frame
// rate. What that costs is honest: before the first pass over a frame, its
// marker is not there yet.
let table = new Map();   // key → { frameNo, kind, partName, text, el, row }

const describe = (event) => {
  if (event.kind === 'userData') {
    const parts = [];
    if (event.text !== undefined) parts.push(JSON.stringify(event.text));
    if (event.integer !== undefined) parts.push(`int=${event.integer}`);
    if (event.point) parts.push(`point(${[...event.point].join(', ')})`);
    if (event.rect) parts.push(`rect(${[...event.rect].join(', ')})`);
    return parts.join('  ') || '(empty)';
  }
  if (event.kind === 'signal') {
    const args = (event.params || []).map((p) => `${p.id}=${p.value}`).join(', ');
    return `${event.commandId}(${args})`;
  }
  return `${event.soundName} ×${event.loopNum}`;
};

const keyOf = (event) => `${event.frameNo}|${event.kind}|${event.partName}|${describe(event)}`;

/** Where a frame sits along the seek bar, in the same space as the thumb. */
function positionOf(frame) {
  const span = Math.max(1, end - start);
  const ratio = Math.min(1, Math.max(0, (frame - start) / span));
  return `calc(var(--thumb) / 2 + ${ratio} * (100% - var(--thumb)))`;
}

function resetTable() {
  table = new Map();
  $('markers').replaceChildren();
  $('events').replaceChildren(Object.assign(document.createElement('div'), {
    className: 'empty',
    textContent: 'Events appear here as the animation plays them.',
  }));
}

function remember(event) {
  const key = keyOf(event);
  if (table.has(key)) return table.get(key);

  const entry = { frameNo: event.frameNo, kind: event.kind, partName: event.partName, text: describe(event) };

  const marker = document.createElement('div');
  marker.className = `marker kind-${event.kind}`;
  marker.style.left = positionOf(event.frameNo);
  marker.title = `frame ${event.frameNo} · ${event.kind} · ${event.partName}\n${entry.text}`;
  marker.addEventListener('click', () => seekTo(event.frameNo));
  $('markers').append(marker);
  entry.el = marker;

  table.set(key, entry);
  redrawList();
  return entry;
}

function redrawList() {
  const rows = [...table.values()].sort((a, b) => a.frameNo - b.frameNo || a.kind.localeCompare(b.kind));
  const body = document.createElement('tbody');
  for (const entry of rows) {
    const tr = document.createElement('tr');
    tr.innerHTML =
      `<td><span class="dot kind-${entry.kind}"></span>${entry.frameNo}</td>` +
      `<td>${entry.kind}</td><td>${escapeHtml(entry.partName)}</td><td>${escapeHtml(entry.text)}</td>`;
    tr.addEventListener('click', () => seekTo(entry.frameNo));
    body.append(tr);
    entry.row = tr;
  }
  const table_ = document.createElement('table');
  table_.innerHTML = '<thead><tr><th>frame</th><th>kind</th><th>part</th><th>payload</th></tr></thead>';
  table_.append(body);
  $('events').replaceChildren(table_);
}

const escapeHtml = (text) => String(text).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function flash(entry) {
  for (const element of [entry.el, entry.row]) {
    if (!element) continue;
    element.classList.remove('fired');
    void element.offsetWidth;   // restart the transition
    element.classList.add('fired');
    setTimeout(() => element.classList.remove('fired'), 320);
  }
}

// --- transport -----------------------------------------------------------

function seekTo(frame) {
  if (!player) return;
  player.seek(frame);
  $('seek').value = String(frame);
  showFrame(frame);
}

function showFrame(frame) {
  $('frame').textContent = `${Number(frame).toFixed(1)} / ${end}`;
}

function setPlaying(next) {
  playing = next;
  $('playPause').textContent = next ? '⏸' : '▶';
  if (!player) return;
  // `play()` is a head-out, not a resume — `resume()` is what carries on in
  // place, and it is a no-op on a stopped animation, so the two are not
  // interchangeable here.
  if (next) player.resume(); else player.pause();
}

// --- loading -------------------------------------------------------------

function fitCanvas() {
  const canvas = $('c');
  const dpr = window.devicePixelRatio || 1;
  const width = Math.max(1, Math.round(canvas.clientWidth * dpr));
  const height = Math.max(1, Math.round(canvas.clientHeight * dpr));
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
    surface?.resize(width, height);
  }
  player?.fitInto(width, height);
}

async function show(name) {
  player.setAnimation(name);
  start = player.startFrame();
  end = player.endFrame();
  $('seek').min = String(start);
  $('seek').max = String(end);
  $('seek').value = String(start);
  $('seek').disabled = false;
  $('playPause').disabled = false;
  $('restart').disabled = false;
  resetTable();
  fitCanvas();
  player.play();
  setPlaying(true);
  showFrame(start);
}

const params = new URLSearchParams(location.search);
const fileName = (url) => decodeURIComponent(new URL(url).pathname.split('/').pop());
const isPack = (url) => /\.ssab$/i.test(new URL(url).pathname);
const byStem = (a, b) => a.replace(/\.ssab$/i, '').localeCompare(b.replace(/\.ssab$/i, ''));
const DROP = $('drop').innerHTML;

function overlay(html) {
  $('drop').innerHTML = html ?? DROP;
  $('drop').classList.remove('hidden');
}

/** While a load runs the player is out of its slot, and the tick skips a disabled picker. */
function busy(on) {
  $('pack').disabled = on || $('pack').options.length < 2;
  $('anim').disabled = on || $('anim').options.length === 0;
}

let choose = () => {};

function listPacks(packs, current) {
  $('pack').replaceChildren(...packs.map(([url, label]) => new Option(label, url)));
  $('pack').value = current;
  $('pack').disabled = packs.length < 2;
}

function unreadable(url) {
  overlay(
    `<strong>Cannot read ${escapeHtml(fileName(url))}</strong>` +
    '<span>This page reads files by path only in a Chrome started with <code>--allow-file-access-from-files</code>, ' +
    'which is how an editor\'s Preview button opens it. Opened any other way, drop the <code>.ssab</code> here ' +
    'with its <code>.png</code> atlases and sibling <code>.ssab</code>, or the folder that holds them.</span>');
}

/**
 * Every entrance ends in one call: the player's own walk reads the pack, the
 * sibling packs its instance parts play from and every atlas through `lookup`,
 * and `missingAssets` names what it did not get.
 *
 * A file that is not at the path the pack names is looked for by file name
 * beside the main `.ssab`, the order Unity's importer resolves in, so what
 * draws in the engine is not missing here.
 */
async function open(url, lookup, initial) {
  busy(true);
  overlay();
  const beside = new URL('.', url);
  let readAny = false;
  const read = async (wanted) => {
    let data = await lookup(wanted);
    const byName = new URL(new URL(wanted).pathname.split('/').pop(), beside).href;
    if (data == null && byName !== wanted) data = await lookup(byName);
    readAny ||= data != null;
    return data ?? null;
  };
  try {
    await player.load(url, read);
  } catch (error) {
    busy(false);
    if (readAny) overlay(`<strong>Could not load ${escapeHtml(fileName(url))}</strong><span>${escapeHtml(error)}</span>`);
    else unreadable(url);
    return;
  }

  $('drop').classList.add('hidden');
  const names = player.animationNames();
  $('anim').replaceChildren(...names.map((name) => new Option(name, name)));
  busy(false);

  const gaps = player.missingAssets().map(({ kind, name }) =>
    kind === 'pack' ? `pack ${name}, whose instance parts draw nothing` : `atlas ${name}, whose parts draw as white silhouettes`);
  note(gaps.length ? `missing ${gaps.join('; ')}` : '', gaps.length > 0);

  if (!names.length) return;
  const wanted = initial && names.includes(initial) ? initial : names[0];
  $('anim').value = wanted;
  await show(wanted);
}

// --- the URL entrance ------------------------------------------------------

// The one `fetch` in this page. At `file://` it reads only in a Chrome started
// with --allow-file-access-from-files; anywhere else every call rejects.
const fetchLocal = (url) => fetch(url).catch(() => null);
const readLocal = async (url) => {
  const response = await fetchLocal(url);
  return response?.ok ? response.arrayBuffer() : null;
};

async function packsBeside(url) {
  const dir = new URL('.', url);
  const listing = await (await fetchLocal(dir.href))?.text() ?? '';
  // One `addRow("name","url",isDir,…)` per entry, both strings JSON-escaped,
  // served with status 0 rather than 200. A Chrome that changes the page
  // leaves the open pack the only one listed.
  const packs = [...listing.matchAll(/addRow\("((?:[^"\\]|\\.)*)","((?:[^"\\]|\\.)*)",0,/g)]
    .map(([, name, href]) => [new URL(JSON.parse(`"${href}"`), dir).href, JSON.parse(`"${name}"`)])
    .filter(([href]) => isPack(href))
    .sort((a, b) => byStem(a[1], b[1]));
  return packs.some(([href]) => href === url) ? packs : [[url, fileName(url)], ...packs];
}

/**
 * Open this page again with other query values. A fresh page reads every file
 * afresh, where loading again in place would keep each atlas the renderer
 * already holds under that URL, and draw a reconverted pack with the old one.
 */
function reopen(changes) {
  const next = new URL(location.href);
  for (const [key, value] of Object.entries(changes)) {
    if (value) next.searchParams.set(key, value);
    else next.searchParams.delete(key);
  }
  location.replace(next.href);
}

async function openUrl(src) {
  const url = new URL(src, location.href).href;
  choose = (pack) => reopen({ ssab: pack, animation: null });
  $('reload').hidden = false;
  listPacks([[url, fileName(url)]], url);
  await open(url, readLocal, params.get('animation'));
  listPacks(await packsBeside(url).catch(() => [[url, fileName(url)]]), url);
}

// --- the bundle entrance: the holes, or one drop -----------------------------

let bundles = 0;

/**
 * Files filed under a base URL of their own, `[path, bytes | File][]` with
 * paths from the bundle's root. The renderer keys atlases by URL, so two drops
 * that both carry a `common.png` must not share a base.
 */
async function openBundle(files, main, initial) {
  const base = new URL(`bundle/${++bundles}/`, location.href);
  const byUrl = new Map(files.map(([path, data]) => [new URL(path, base).href, data]));
  const depth = (href) => href.split('/').length;
  const packs = [...byUrl.keys()].filter(isPack).sort((a, b) => depth(a) - depth(b) || byStem(a, b));
  if (!packs.length) { note('no .ssab among the dropped files', true); return; }

  const lookup = (url) => byUrl.get(url) ?? null;
  choose = (pack) => open(pack, lookup);
  $('reload').hidden = true;
  const first = main ? new URL(main, base).href : packs[0];
  listPacks(packs.map((href) => [href, decodeURIComponent(href.slice(base.href.length))]), first);
  await open(first, lookup, initial);
}

async function walk(handle, prefix) {
  if (!handle) return [];
  if (handle.kind === 'file') return [[prefix + handle.name, await handle.getFile()]];
  const files = [];
  for await (const child of handle.values()) files.push(...await walk(child, `${prefix}${handle.name}/`));
  return files;
}

// --- boot ----------------------------------------------------------------

$('licenses').addEventListener('click', () => {
  if (!$('noticesText').textContent) $('noticesText').textContent = JSON.parse($('notices').textContent);
  $('noticesDialog').showModal();
});

(async () => {
  try {
    await wasm_bindgen({ module_or_path: bytes($('wasm').textContent) });
  } catch (error) {
    overlay(`<strong>Could not start the player</strong><span>${escapeHtml(error)}</span>`);
    return;
  }
  try {
    ctx = await wasm_bindgen.SsContextWeb.create();
  } catch (error) {
    overlay(
      '<strong>No WebGPU here</strong>' +
      '<span>This page needs a browser with WebGPU, as Chrome and Edge are. If yours is one, open ' +
      '<code>chrome://gpu</code> and read the WebGPU line under Graphics Feature Status: a virtual machine or ' +
      'remote desktop with no GPU passed to it, or a GPU or driver on Chrome\'s blocklist, turns it off.</span>');
    return;
  }
  surface = ctx.createSurface($('c'));
  player = surface.createPlayer();
  // A diagnostic artifact should be pokeable: this page exists so someone can
  // say "renders here, not in my engine", and the next question is always a
  // number the console can answer.
  window.ssPreview = { ctx, surface, player };

  // The `.ssab` schema version has not moved, so a shell from another SDK
  // release does not fail on a pack: it quietly draws it as that release does.
  const converter = params.get('converter');
  if (converter) {
    const sdk = ctx.sdkVersion.replace(/^v/, '');
    const converted = converter.split('+')[0];
    $('converted').textContent = `converted with SDK ${converter}`;
    if (converted !== sdk) {
      $('mismatch').textContent = `Converted with SDK ${converted}, played here as SDK ${sdk}: the two releases can draw the same .ssab differently.`;
      $('mismatch').hidden = false;
    }
  }

  $('playPause').addEventListener('click', () => setPlaying(!playing));
  $('restart').addEventListener('click', () => { player.play(); setPlaying(true); });
  $('pack').addEventListener('change', (e) => choose(e.target.value));
  $('anim').addEventListener('change', (e) => show(e.target.value));
  $('reload').addEventListener('click', () => reopen({ animation: $('anim').value }));
  $('seek').addEventListener('pointerdown', () => { dragging = true; });
  window.addEventListener('pointerup', () => { dragging = false; });
  $('seek').addEventListener('input', (e) => seekTo(parseFloat(e.target.value)));
  $('speed').addEventListener('input', (e) => {
    player.setSpeedScale(parseFloat(e.target.value));
    $('speedOut').textContent = parseFloat(e.target.value).toFixed(1);
  });
  $('sub').addEventListener('change', (e) => player.setSubFrameEnabled(e.target.checked));

  const stage = $('stage');
  for (const type of ['dragenter', 'dragover']) {
    stage.addEventListener(type, (e) => { e.preventDefault(); $('drop').classList.add('over'); });
  }
  stage.addEventListener('dragleave', () => $('drop').classList.remove('over'));
  stage.addEventListener('drop', async (e) => {
    e.preventDefault();
    $('drop').classList.remove('over');
    // Taken before the first await, which empties the DataTransfer. At
    // `file://` only `getAsFileSystemHandle` reads a dropped folder:
    // `webkitGetAsEntry` hands out entries that throw EncodingError when read.
    // A browser without it gets the dropped files, and a folder as one empty file.
    const items = [...e.dataTransfer.items].filter((item) => item.kind === 'file');
    const handles = items.every((item) => item.getAsFileSystemHandle) ? items.map((item) => item.getAsFileSystemHandle()) : null;
    const dropped = [...e.dataTransfer.files];
    try {
      const files = handles
        ? (await Promise.all(handles.map(async (handle) => walk(await handle, '')))).flat()
        : dropped.map((file) => [file.name, file]);
      await openBundle(files);
    } catch (error) {
      note(String(error), true);
    }
  });

  new ResizeObserver(() => fitCanvas()).observe(stage);
  fitCanvas();

  // A host's Preview button names the `.ssab` in the URL. Otherwise the pack
  // the generator inlined, if any, and everything it depends on — sibling packs
  // and atlases alike — in the second hole, keyed by the path the pack names.
  const inlined = bytes($('ssab').textContent);
  if (params.get('ssab')) {
    await openUrl(params.get('ssab'));
  } else if (inlined) {
    const name = $('ssab').dataset.name || 'inlined.ssab';
    const holed = JSON.parse($('files').textContent || '{}');
    await openBundle([[name, inlined], ...Object.entries(holed).map(([path, b64]) => [path, bytes(b64)])], name, $('ssab').dataset.animation);
  }

  let previous = performance.now();
  const tick = (now) => {
    const dt = Math.min(0.1, (now - previous) / 1000);
    previous = now;
    if (player && !$('anim').disabled) {
      surface.frame(dt);
      for (const event of player.events()) flash(remember(event));
      if (!dragging) {
        const frame = player.frameNo();
        $('seek').value = String(frame);
        showFrame(frame);
      }
      if (playing && !player.isPlaying()) setPlaying(false);   // a one-shot that ended
      const stats = surface.stats();
      $('stats').textContent = `${stats.prims} prims · ${stats.drawCalls} draws · ${(stats.uploadedBytes / 1024).toFixed(1)} KiB/frame`;
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
