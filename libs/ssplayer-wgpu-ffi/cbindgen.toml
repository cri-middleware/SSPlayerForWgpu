# cbindgen config for the `ffi` face (SPEC §11). Driven by build.rs when the
# `ffi` feature is on; the output is libs/ssplayer-wgpu-ffi/include/ssplayer_wgpu.h.

language = "C"
header = "/* SPDX-License-Identifier: BSD-3-Clause */\n/* ssplayer-wgpu — C API for the wgpu SpriteStudio player. */"
include_guard = "SSPLAYER_WGPU_H"
autogen_warning = "/* Generated by cbindgen from libs/ssplayer-wgpu/src/ffi.rs. Do not edit by hand. */"
cpp_compat = true
documentation_style = "c"
# Refer to types by their typedef (`ss_player_t *`), not `struct ss_player_t *`.
style = "type"
line_length = 110
tab_width = 4
# `usize` is the C `size_t`, not a pointer-sized integer typedef.
usize_is_size_t = true
# Only the headers the API actually needs (no stdarg.h / stdlib.h).
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]

[parse]
# The C API is defined entirely in ssplayer-wgpu; nothing is re-exported from wgpu
# or the SDK, so there is no reason to walk dependencies.
parse_deps = false

[export]
# cbindgen sweeps up every `pub const` in the crate, including ones that have
# nothing to do with the C API. Keep the header to `src/ffi.rs`'s surface.
exclude = ["IDENTITY_TRANSFORM", "MAX_MASK_WRITERS", "COVERAGE_LAYER_BITS", "MAX_TREE_MASK_WRITERS"]

# Types keep idiomatic Rust names in the source and take their C names here, so
# the header reads like the hand-written API sketch in SPEC §11.
[export.rename]
"SsScene" = "ss_scene_t"
"SsPlayer" = "ss_player_t"
"SsSceneDesc" = "ss_scene_desc_t"
"SsSceneStats" = "ss_scene_stats_t"
"SsTextureRef" = "ss_texture_ref_t"
"SsWindowHandle" = "ss_window_handle_t"
