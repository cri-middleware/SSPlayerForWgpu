[package]
name = "ssplayer-wgpu"
version = "7.0.0-beta.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true

[lib]
crate-type = ["rlib"]


[features]
default = ["embedded"]
# Decode embedded-mode ssab textures (PNG atlases) inside the player via the
# `image` crate. Turn off for lean WASM builds that decode textures
# host-side (e.g. the browser's `createImageBitmap`) and supply them by hash.
embedded = ["dep:image"]
# WebGPU / JS bindings (the "js" face): a wasm-bindgen wrapper that
# owns wgpu created from an HTML canvas and drives the borrow-model SSPlayer.
# Build with `--target wasm32-unknown-unknown` + wasm-bindgen.
# **Deliberately does not pull `embedded`**: the browser already ships an image
# decoder, so embedded atlases go out as encoded bytes (`embeddedTextures`) and
# come back through `createImageBitmap` (`addTextureFromBytes`) — the same split
# ssplayer-core/ssplayer-webgl use. Bundling `image` on top of that cost 59 KB
# brotli (201 KB -> 142 KB, -29%) to duplicate a decoder that was already there.
# Add `embedded` back for a page that would rather not write that glue.
web = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys", "dep:console_error_panic_hook", "wasm-bindgen/std"]
# C/C++ bindings (the "ffi" face): `ss_player_*` entry points plus a
# self-contained host that builds wgpu from a raw window handle. `build.rs` runs
# cbindgen over `src/ffi.rs` to emit `include/ssplayer_wgpu.h`. Pulls `embedded`
# so a single self-contained .ssab renders with no host texture supply.
ffi = ["dep:pollster", "embedded"]

[dependencies]
wgpu = { workspace = true }
ssruntime = { workspace = true }
ssab = { workspace = true }
bytemuck = { version = "1.25.2", features = ["derive"] }
image = { version = "0.25.10", optional = true, default-features = false, features = ["png"] }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
# `Blob` / `ImageBitmap*` / `PremultiplyAlpha` are the browser-side texture
# decoder this face uses in place of a bundled one.
web-sys = { workspace = true, optional = true, features = ["HtmlCanvasElement", "Window", "Document", "Blob", "ImageBitmap", "ImageBitmapOptions", "PremultiplyAlpha", "Response", "Url", "console"] }
console_error_panic_hook = { workspace = true, optional = true }
# The C face blocks on wgpu's async adapter/device requests: a C caller has no
# executor to hand us.
pollster = { version = "1.0.1", optional = true }


[dev-dependencies]
pollster = "1.0.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
