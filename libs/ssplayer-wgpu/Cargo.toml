[package]
name = "ssplayer-wgpu"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true

# cdylib for the WebGPU/WASM target (wasm-bindgen) and for C hosts that link the
# shared library; rlib for the viewer/tests; staticlib for C hosts that link it
# in (SPEC §11). crate-type cannot be feature-gated, so all three are always built.
[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

# Enable exactly the wasm features rustc emits (`+simd128` from `.cargo/config.toml`
# plus its wasm32 defaults) so release `wasm-opt` validation passes. Do NOT use
# `--all-features`: on newer wasm-opt it enables experimental *output* proposals
# that browsers reject at instantiation. Mirrors libs/ssruntime/Cargo.toml.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-simd",
    "--enable-bulk-memory",
    "--enable-mutable-globals",
    "--enable-sign-ext",
    "--enable-nontrapping-float-to-int",
    "--enable-multivalue",
    "--enable-reference-types",
]

[features]
default = ["embedded"]
# Decode embedded-mode ssab textures (PNG atlases) inside the player via the
# `image` crate (SPEC §8.1). Turn off for lean WASM builds that decode textures
# host-side (e.g. the browser's `createImageBitmap`) and supply them by hash.
embedded = ["dep:image"]
# WebGPU / JS bindings (SPEC §12 P1, the "js" face): a wasm-bindgen wrapper that
# owns wgpu created from an HTML canvas and drives the borrow-model SSPlayer.
# Pulls `embedded` so a single self-contained .ssab renders with no host texture
# supply. Build with `--target wasm32-unknown-unknown` + wasm-bindgen.
# `ssruntime/std` makes the runtime use std on wasm so the standard allocator +
# panic handler satisfy its cdylib/staticlib artifacts (cargo builds every
# crate-type of a dep). core already uses std for wgpu, so there is no conflict —
# unlike `ssruntime/panic-handler`, which would duplicate std's `panic_impl`.
web = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys", "dep:console_error_panic_hook", "wasm-bindgen/std", "embedded", "ssruntime/std"]
# C/C++ bindings (SPEC §12 P5, the "ffi" face): `ss_player_*` entry points plus a
# self-contained host that builds wgpu from a raw window handle. `build.rs` runs
# cbindgen over `src/ffi.rs` to emit `include/ssplayer_wgpu.h`. Pulls `embedded`
# so a single self-contained .ssab renders with no host texture supply.
ffi = ["dep:pollster", "dep:cbindgen", "embedded"]

[dependencies]
wgpu = { workspace = true }
ssruntime = { workspace = true }
ssab = { workspace = true }
bytemuck = { version = "1.25.0", features = ["derive"] }
image = { version = "0.25.10", optional = true, default-features = false, features = ["png"] }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["HtmlCanvasElement", "Window", "Document"] }
console_error_panic_hook = { workspace = true, optional = true }
# The C face blocks on wgpu's async adapter/device requests: a C caller has no
# executor to hand us.
pollster = { version = "1.0.1", optional = true }

# Only pulled in by the `ffi` feature; build.rs is a no-op without it.
[build-dependencies]
cbindgen = { version = "0.29.4", optional = true, default-features = false }

[dev-dependencies]
pollster = "1.0.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
