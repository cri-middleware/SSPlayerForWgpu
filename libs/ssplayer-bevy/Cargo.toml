[package]
name = "ssplayer-bevy"
# Independent of the player's version: the adapter tracks Bevy's release line,
# the player tracks the SDK's.
version = "0.1.0-alpha.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Bevy adapter for the wgpu SpriteStudio player"
# Not on crates.io while the API is still moving.
publish = false

[dependencies]
ssplayer-wgpu = { workspace = true }
wgpu = { workspace = true }
# Only what an adapter needs: the render app, the 2d core pipeline (for the
# `Core2d` schedule this draws in), assets and a window. Deliberately *not*
# `bevy_sprite_render` — this crate draws with the player's own pipelines and
# never touches Bevy's 2d renderer, so an app that wants no `bevy_sprite` still
# gets characters. No audio, glTF, PBR or UI either; those are the host's.
bevy = { workspace = true, features = [
    "std",
    "multi_threaded",
    "bevy_log",
    "bevy_asset",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_window",
    "bevy_winit",
    "png",
] }

# The render test composites a Bevy sprite under the characters to check the two
# renderers share a target, and that needs Bevy's 2d renderer — which is
# `bevy_sprite_render`, a separate feature from `bevy_sprite` (that one is the
# component API alone, and a `Sprite` spawned without the renderer silently
# draws nothing). Kept out of the library's own features so the dependency stays
# honest about what the adapter itself needs. The runnable examples live in their
# own crates (`examples/overall-bevy`, `examples/viewer-bevy`) and carry the
# heavier host features — audio, UI, text — that only a host, not this crate, needs.
[dev-dependencies]
# `bevy_sprite*` for the composited sprite in `tests/bevy_render.rs`.
bevy = { workspace = true, features = ["bevy_sprite", "bevy_sprite_render"] }
ssplayer-wgpu = { workspace = true }
wgpu = { workspace = true }
pollster = "1.0.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ssruntime = { workspace = true }
